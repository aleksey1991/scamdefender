<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScamDefender</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="shield-icon">🛡️</span>
            <h1>ScamDefender</h1>
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="loading-state hidden">
            <div class="spinner"></div>
            <p>Analyzing...</p>
        </div>

        <!-- Trusted Site Indicator -->
        <div id="trusted-indicator" class="trusted-indicator hidden">
            <span class="trusted-icon">✓</span>
            <span class="trusted-text">Trusted Site</span>
        </div>

        <!-- Main Content -->
        <div id="main-content" class="main-content hidden">
            <!-- Domain Name -->
            <div class="domain-section">
                <div class="domain-label">Domain</div>
                <div id="domain-name" class="domain-name">-</div>
            </div>

            <!-- Risk Score -->
            <div class="risk-score-section">
                <div id="risk-score" class="risk-score">0</div>
                <div id="risk-label" class="risk-label">SAFE</div>
            </div>

            <!-- Signal Indicators -->
            <div id="signals" class="signals">
                <div class="signal-item" id="signal-https">
                    <div class="signal-header">
                        <span class="signal-icon">⏳</span>
                        <span class="signal-name">HTTPS</span>
                    </div>
                    <div class="signal-value">Checking...</div>
                </div>
                <div class="signal-item" id="signal-domain-age">
                    <div class="signal-header">
                        <span class="signal-icon">⏳</span>
                        <span class="signal-name">Domain Age</span>
                    </div>
                    <div class="signal-value">Checking...</div>
                </div>
                <div class="signal-item" id="signal-safe-browsing">
                    <div class="signal-header">
                        <span class="signal-icon">⏳</span>
                        <span class="signal-name">Safe Browsing</span>
                    </div>
                    <div class="signal-value">Checking...</div>
                </div>
                <div class="signal-item" id="signal-trustpilot">
                    <div class="signal-header">
                        <span class="signal-icon">⏳</span>
                        <span class="signal-name">Trustpilot</span>
                    </div>
                    <div class="signal-value">Checking...</div>
                </div>
                <div class="signal-item" id="signal-page-scan">
                    <div class="signal-header">
                        <span class="signal-icon">⏳</span>
                        <span class="signal-name">Page Scan</span>
                    </div>
                    <div class="signal-value">Checking...</div>
                </div>
            </div>
        </div>

        <!-- AI Analysis Section -->
        <div id="ai-section" class="ai-section" style="display: none;">
            <div class="ai-header">
                <span>🤖</span>
                <h2>AI Analysis</h2>
            </div>
            <div id="ai-content"></div>
        </div>
    </div>
    <script type="module" src="popup.js"></script>
</body>
</html>
